<!DOCTYPE html>

<head>

<title>Chelsea &amp; Westminster SC — Swimming Results</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:linear-gradient(170deg,#0A2342 0%,#1565C0 55%,#29B6F6 100%);
  background-attachment:fixed;
  min-height:100vh;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  padding:80px 16px 40px;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(180deg,
    transparent 0px,transparent 56px,
    rgba(255,255,255,0.04) 56px,rgba(255,255,255,0.04) 58px);
  pointer-events:none;z-index:0;
}
.ripple{position:fixed;bottom:-80px;border-radius:50%;background:rgba(255,255,255,0.08);animation:rise linear infinite;z-index:0;pointer-events:none}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.7}90%{opacity:.2}100%{transform:translateY(-110vh) translateX(10px);opacity:0}}
.card{
  background:#fff;border-radius:24px;
  padding:0 28px 28px;width:100%;max-width:460px;
  margin:0 auto;
  box-shadow:0 24px 64px rgba(0,0,0,0.35);
  text-align:center;position:relative;z-index:1;
}
.mascot{
  width:110px;height:110px;
  background:linear-gradient(135deg,#1565C0,#29B6F6);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:3.5rem;margin:-55px auto 18px;
  border:6px solid #fff;
  box-shadow:0 8px 24px rgba(21,101,192,0.4);
  animation:bob 3s ease-in-out infinite;
  overflow:hidden;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.club{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:900;color:#0A2342;line-height:1.1;margin-bottom:2px}
.sub{color:#aaa;font-size:.75rem;letter-spacing:1.8px;text-transform:uppercase;margin-bottom:14px}
.desc{color:#555;font-size:.88rem;line-height:1.55;margin-bottom:22px;overflow-wrap:break-word}
.desc strong{color:#1565C0}
.wb-box{background:#E3F2FD;border:1px solid #BBDEFB;border-radius:14px;padding:13px 16px;color:#0D47A1;font-size:.9rem;font-weight:600;margin-bottom:12px}
.select-wrap{position:relative;margin-bottom:12px}
.select-wrap::after{content:'▾';position:absolute;right:16px;top:50%;transform:translateY(-50%);color:#1565C0;pointer-events:none;font-size:1rem}
.swimmer-sel{
  width:100%;padding:13px 40px 13px 16px;
  border-radius:12px;border:2px solid #E0E0E0;
  font-size:.95rem;color:#1A1A2E;background:#fff;
  appearance:none;-webkit-appearance:none;outline:none;cursor:pointer;
  transition:border-color .2s;
}
.swimmer-sel:focus{border-color:#1565C0}
.go-btn{
  width:100%;padding:14px;background:#1565C0;color:#fff;
  border:none;border-radius:99px;font-size:1rem;font-weight:700;
  cursor:pointer;box-shadow:0 4px 0 #0D47A1;
  transition:transform .1s,box-shadow .1s;margin-bottom:8px;
}
.go-btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 #0D47A1}
.go-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0D47A1}
.change-btn{background:none;border:none;color:#bbb;font-size:.8rem;cursor:pointer;text-decoration:underline;padding:2px 0}
.change-btn:hover{color:#1565C0}
</style>
</head>

<script>
var KEY_NAME = 'bsc_swimmer';
var KEY_URL  = 'bsc_swimmer_url';

for(var i=0;i<12;i++){
  var b=document.createElement('div');b.className='ripple';
  var sz=8+Math.random()*22;
  b.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+Math.random()*100+'%;animation-duration:'+(8+Math.random()*10)+'s;animation-delay:'+(Math.random()*8)+'s';
  document.body.appendChild(b);
}

function init(){
  var name=localStorage.getItem(KEY_NAME);
  var url=localStorage.getItem(KEY_URL);
  if(name && url){
    document.getElementById('wb-name').textContent=name.split(' ')[0];
    document.getElementById('wb').style.display='block';
    document.getElementById('picker').style.display='none';
  }
}

function go(){
  var sel=document.getElementById('swimmer-sel');
  if(!sel.value){sel.focus();return;}
  var opt=sel.options[sel.selectedIndex];
  localStorage.setItem(KEY_NAME,sel.value);
  localStorage.setItem(KEY_URL,opt.getAttribute('data-url'));
  window.location.href=opt.getAttribute('data-url');
}

function goToResults(){
  window.location.href='cwsc_u14_girls_rankings.html';
}

function showPicker(){
  document.getElementById('wb').style.display='none';
  document.getElementById('picker').style.display='block';
}

document.addEventListener('keydown',function(e){if(e.key==='Enter')go();});
init();
</script>
