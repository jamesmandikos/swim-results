<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Swimming Results</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A2342">
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{
  background:linear-gradient(160deg,#0A2342 0%,#1565C0 60%,#29B6F6 100%);
  background-attachment:fixed;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px
}
.title{color:white;font-size:22px;font-weight:700;margin-bottom:6px;text-align:center}
.subtitle{color:rgba(255,255,255,.65);font-size:13px;margin-bottom:40px;text-align:center}
.card{
  background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.22);
  border-radius:16px;padding:22px 24px;width:100%;max-width:320px;
  text-decoration:none;display:block;margin-bottom:14px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:background .15s,transform .12s;cursor:pointer;
}
.card:active{background:rgba(255,255,255,.22);transform:scale(.98)}
.card-club{color:rgba(255,255,255,.7);font-size:11px;font-weight:700;
  letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px}
.card-name{color:white;font-size:17px;font-weight:700;margin-bottom:4px}
.card-desc{color:rgba(255,255,255,.6);font-size:12px}
.arrow{float:right;color:rgba(255,255,255,.5);font-size:18px;margin-top:-2px}
</style>
</head>
<body>
<div class="title">Swimming Results</div>
<div class="subtitle">Select your club to view rankings</div>

<a class="card" href="cwsc.html">
  <span class="arrow">→</span>
  <div class="card-club">CWSC</div>
  <div class="card-name">Chelsea &amp; Westminster SC</div>
  <div class="card-desc">Personal results &amp; age-group rankings</div>
</a>

<a class="card" href="brompton_home.html">
  <span class="arrow">→</span>
  <div class="card-club">BSC</div>
  <div class="card-name">Brompton SC</div>
  <div class="card-desc">Club rankings across all age groups</div>
</a>
</body>
</html>
